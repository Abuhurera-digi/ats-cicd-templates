name: Build & Deploy Service
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      container_name:
        required: false
        type: string
        default: ""
      service_path:
        required: true
        type: string
      container_port:
        required: true
        type: string
      memory_limit:
        required: true
        type: string
      extra_run_args:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_SSH_KEY:
        required: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build jar
        working-directory: ${{ inputs.service_path }}
        run: ./mvnw clean package -DskipTests
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push image
        working-directory: ${{ inputs.service_path }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/${{ inputs.service_name }}
          docker build --platform linux/amd64 -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ inputs.service_name }}
            CONTAINER_NAME="${{ inputs.container_name }}"
            if [ -z "$CONTAINER_NAME" ]; then CONTAINER_NAME="${{ inputs.service_name }}"; fi
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            sudo docker pull $IMAGE:latest
            sudo docker stop $CONTAINER_NAME 2>/dev/null || true
            sudo docker rm $CONTAINER_NAME 2>/dev/null || true
            sudo docker run -d \
              -p ${{ inputs.container_port }}:${{ inputs.container_port }} \
              -m ${{ inputs.memory_limit }} \
              --add-host=host.docker.internal:host-gateway \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              ${{ inputs.extra_run_args }} \
              $IMAGE:latest
